# CodeSage — `docker compose up --build`, then open http://localhost:5000
# Requires JWT_SECRET and at least one provider key in .env (see .env.example).
# Ollama is optional: `docker compose --profile ollama up` also starts a local
# Ollama container and points CodeSage at it.

services:
  codesage:
    build: .
    container_name: codesage
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/data/codesage.db
      WORKSPACE_ROOT: /app/data/workspaces
      INDEX_CACHE_DIR: /app/data/index_cache
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - codesage_data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  codesage_data:
  ollama_models:
