# Render Blueprint — New + > Blueprint, point it at this repo.
# Uses the Dockerfile; SQLite, indexes and cloned workspaces live on a
# persistent disk. For a managed database instead, add a Render PostgreSQL
# instance and set DATABASE_URL to its connection string.
services:
  - type: web
    name: codesage
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # persistent disks require a paid instance type
    healthCheckPath: /health
    disk:
      name: codesage-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: OLLAMA_ENABLED
        value: "false"
      - key: ALLOW_ANY_WORKSPACE_PATH
        value: "false"
      - key: ALLOW_GIT_CLONE
        value: "true"
