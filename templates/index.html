<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local Coding Agent</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛠️ Local Coding Agent</h1>
      <div class="model-row">
        <label for="provider-select">Provider:</label>
        <select id="provider-select"></select>
        <label for="model-select">Model:</label>
        <select id="model-select"></select>
        <span id="status-dot" class="status-dot" title="Provider status"></span>
      </div>
    </header>

    <section class="repo-panel">
      <div class="repo-row">
        <input id="repo-path" type="text" placeholder="Absolute path to a local repo, e.g. /Users/you/project" />
        <button id="index-btn" type="button">Index Repo</button>
        <label class="repo-toggle">
          <input id="use-repo" type="checkbox" disabled />
          Use repo context
        </label>
        <button id="run-tests-btn" type="button" class="secondary" disabled>Run tests</button>
      </div>
      <div id="repo-status" class="repo-status">No repo indexed yet.</div>
      <pre id="test-output" class="diff-view" style="display:none;"></pre>
    </section>

    <section class="edit-panel">
      <button id="edit-toggle" type="button" class="edit-toggle">▸ Propose a code edit</button>
      <div id="edit-body" class="edit-body" style="display:none;">
        <input id="edit-path" type="text" placeholder="Path to the file, relative to the indexed repo, e.g. app.py or src/utils.py" />
        <textarea id="edit-instruction" rows="2" placeholder="Describe the change, e.g. 'add a docstring to the chat() function'"></textarea>
        <button id="propose-btn" type="button">Propose Edit</button>
      </div>
    </section>

    <section class="edit-panel">
      <button id="diagnose-toggle" type="button" class="edit-toggle">▸ Diagnose &amp; fix a bug</button>
      <div id="diagnose-body" class="edit-body" style="display:none;">
        <textarea id="diagnose-problem" rows="3" placeholder="Describe the bug or paste an error/traceback. The agent will search the indexed repo to find the likely file and propose a fix."></textarea>
        <button id="diagnose-btn" type="button">Diagnose &amp; Fix</button>
      </div>
    </section>

    <section class="review-panel" id="review-panel" style="display:none;">
      <div id="edit-status" class="repo-status"></div>
      <div id="edit-explanation" class="edit-explanation" style="display:none;"></div>
      <pre id="diff-view" class="diff-view" style="display:none;"></pre>
      <div id="edit-actions" class="edit-actions" style="display:none;">
        <button id="apply-btn" type="button">Apply to file</button>
        <button id="discard-btn" type="button" class="secondary">Discard</button>
      </div>
    </section>

    <main id="chat"></main>

    <form id="chat-form">
      <textarea id="input" placeholder="Ask a coding question, paste a snippet to complete/fix, etc. (Shift+Enter for newline)" rows="3"></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
